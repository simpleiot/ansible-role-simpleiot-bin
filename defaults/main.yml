siot_version: 0.28.0
siot_binary: siot
siot_architecture: linux-x86_64

# Since v0.20 a release publishes bare executables rather than tarballs, so the
# download is the binary itself and there is nothing to extract.
siot_download:
  "https://github.com/simpleiot/simpleiot/releases/download/v{{ siot_version
  }}/simpleiot-v{{ siot_version }}-{{ siot_architecture }}"
# Downloaded under its release name so that changing siot_version always fetches
# the new binary, then installed to siot_bin_dir.
siot_download_dest: /root/simpleiot-v{{ siot_version }}-{{ siot_architecture }}

# recommend using a uuid for auth token. Can be generated
# using the uuidgen utility (part of util-linux).
# If left "", token auth will be disabled.
# The token is written to siot_env_file rather than the unit file, which is
# world readable.
siot_auth_token: ""
# Environment file the service reads the token from, readable by siot_user
# only. This is where `siot install` puts it as well.
siot_env_file: "{{ siot_data_dir }}/siot.env"
# siot_user must be set to caddy2 user if you want
# re-use caddy's TLS certs for the embedded NATS
# in SIOT
siot_user: "{{ siot_binary }}"
# siot_domain is used if we try to share caddy TLS certs to do
# NATS TLS. Generally it is easier to just use NATS over websockets
# and let Caddy handle TLS.
siot_domain: siot.xyz.com
siot_data_dir: /home/{{ siot_binary }}
siot_bin_dir: /usr/local/bin
# Ports. Left "", a port is not passed to Simple IoT at all and its own default
# applies, which is what these settings were repeating: through v0.27 the web UI
# was on 8118, NATS monitoring on 8222, and the NATS WebSocket on 9222. Since
# v0.28 the web UI is one above the NATS port and monitoring two above it, the
# WebSocket listener takes a port Simple IoT finds for itself, and
# SIOT_NATS_HTTP_PORT and SIOT_NATS_WS_PORT are gone. Set one to move that
# listener off the default; a reverse proxy in front of the web UI needs the
# number either way.
siot_http_port: ""
siot_nats_port: 4222
siot_nats_http_port: ""
siot_nats_ws_port: ""
# v0.28 and later; moves NATS monitoring, which listens on localhost
siot_nats_monitor_port: ""

# note the following must be changed from localhost to your URL
# if you are using TLS certs for NATS
siot_nats_url: nats://localhost:{{ siot_nats_port }}
siot_nats_tls_timeout: 30

# Provisioning. siot_provisioning_src is a directory in the playbook repo
# holding YAML files that describe the configuration this instance should have.
# SIOT applies them at start-up and again whenever one of them changes. Leave it
# "" to configure the instance through the UI instead.
siot_provisioning_src: ""
siot_provisioning_dir: /etc/{{ siot_binary }}/provisioning
# Run the provisioning files through Jinja on the way to the server, so a file
# can carry a value the playbook holds rather than repeating it -- the hash of
# an enrollment token kept in a vault, for example. Leave it false for files
# that carry Jinja syntax of their own, which templating would try to resolve.
siot_provisioning_template: false
siot_provisioning_interval: 60s

# Additional environment variables for the service, written into the unit file
# as Environment= lines. Useful for SIOT settings this role has no dedicated
# variable for, e.g.:
#
# siot_extra_env:
#   SIOT_STORE_MAX_MSGS_PER_SUBJECT: "90000"
siot_extra_env: {}

# Memory ceiling for the service, in megabytes, set as systemd's MemoryMax so
# the kernel stops the service growing past it. GOMEMLIMIT is set to 80% of it,
# so the Go garbage collector works harder as the heap nears the ceiling rather
# than the service being killed on reaching it. 0 leaves both unset.
siot_memory_max_mb: 0

# systemd sandboxing, matching what `siot install` generates for a system
# service. Set to false for a deployment that needs the service to reach more
# of the system than the directories below.
siot_sandbox: true
# /home is read-only rather than hidden, because sharing Caddy's certificates
# with NATS reads them out of Caddy's home directory, and siot_data_dir can
# live under /home as well.
siot_protect_home: read-only
# The paths the service may write. The data directory holds the store, the
# device key, and the token. `siot update` replaces the binary in place, so a
# deployment that uses it adds siot_bin_dir here.
siot_read_write_paths:
  - "{{ siot_data_dir }}"
